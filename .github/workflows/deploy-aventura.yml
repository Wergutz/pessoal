name: Aventura Escoteira 2026

# Destino: pontuacaoatividade.com.br/aventuraescoteira26
#
# A aplicacao fica numa SUBPASTA do dominio, do mesmo jeito que o
# lanceiros2026. Por isso o .htaccess da aventura nao ancora nenhuma regra
# na raiz do site: ele protege src/, data/ e testes/ em qualquer nivel.
#
# Host, usuario, porta e destino podem ser trocados sem mexer neste arquivo,
# por variaveis do repositorio (Settings > Secrets and variables > Actions):
# AVENTURA_REMOTE_HOST, AVENTURA_REMOTE_USER, AVENTURA_REMOTE_PORT e
# AVENTURA_TARGET. O secret SSH_PRIVATE_KEY e obrigatorio.

on:
  push:
    branches:
      - main
    paths:
      - 'aventura/**'
      - '.github/workflows/deploy-aventura.yml'
  pull_request:
    paths:
      - 'aventura/**'
  workflow_dispatch:

jobs:
  testes:
    name: Sintaxe e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring

      - name: Conferir a sintaxe de todos os arquivos PHP
        run: find aventura -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Rodar os testes
        run: php aventura/testes/executar.php

  deploy:
    name: Publicar
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Conferir se a chave SSH esta configurada
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Falta o secret SSH_PRIVATE_KEY."
            exit 1
          fi
          echo "Publicando em ${{ vars.AVENTURA_TARGET || '~/domains/pontuacaoatividade.com.br/public_html/aventuraescoteira26/' }}"

      - name: Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ vars.AVENTURA_REMOTE_HOST || '147.93.38.158' }}
          REMOTE_USER: ${{ vars.AVENTURA_REMOTE_USER || 'u278289683' }}
          REMOTE_PORT: ${{ vars.AVENTURA_REMOTE_PORT || '65002' }}
          SOURCE: aventura/
          TARGET: ${{ vars.AVENTURA_TARGET || '~/domains/pontuacaoatividade.com.br/public_html/aventuraescoteira26/' }}
          # O rsync roda com --delete. Os arquivos listados aqui ficam de fora
          # da sincronia E protegidos da exclusao, entao o banco SQLite do
          # servidor sobrevive a cada publicacao. O data/.htaccess continua
          # sendo enviado, porque so os *.sqlite* estao de fora.
          EXCLUDE: "/data/*.sqlite*, /testes/, .git*, *.md"
